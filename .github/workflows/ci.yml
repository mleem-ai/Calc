name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-test:
    name: flutter analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - name: Версия Flutter
        run: flutter --version

      - name: Зависимости
        run: flutter pub get

      - name: Анализ
        run: flutter analyze

      - name: Тесты
        run: flutter test