# Добавь в КОНЕЦ pubspec.yaml (на верхний уровень, без отступа).
# Сами пакеты ставятся командой:
#   flutter pub add --dev flutter_launcher_icons flutter_native_splash sqflite_common_ffi

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/brand/app_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/brand/app_icon_fg.png"
  adaptive_icon_monochrome: "assets/brand/app_icon_fg.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#000000"
  color_dark: "#000000"
  image: assets/brand/splash_logo.png
  android: true
  ios: false
  web: false
  android_12:
    color: "#000000"
    image: assets/brand/splash_logo.png
