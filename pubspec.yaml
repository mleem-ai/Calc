name: kitex_calc
description: "KITex Calc: калькулятор товаров из Китая в рублях."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.0
  sqflite_common_ffi: ^2.3.0
  path_provider: ^2.1.0
  path: ^1.9.0
  http: ^1.2.0
  share_plus: ^13.3.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/brand/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/brand/app_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/brand/app_icon_fg.png"
  adaptive_icon_monochrome: "assets/brand/app_icon_fg.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/brand/app_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/brand/app_icon.png"

flutter_native_splash:
  color: "#000000"
  color_dark: "#000000"
  image: assets/brand/splash_logo.png
  android: true
  ios: false
  web: false
  android_12:
    color: "#000000"
    image: assets/brand/splash_logo.png